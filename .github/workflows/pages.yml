# Builds the site (static files plus a page per spot, from the map's KML) and
# publishes it to GitHub Pages: on every push, every night, and by hand from
# the Actions tab. Repo settings -> Pages -> Source must be "GitHub Actions".
name: Publish

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 10 * * *" # daily, 10:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-spot-pages.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
